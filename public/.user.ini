; Confirmed real bug: PHP's stock defaults (post_max_size=8M,
; upload_max_filesize=2M) are both far under what this app's own upload
; form promises ("max 15MB each, up to 10 files, 150MB total") — a single
; file near the app's own stated limit, or a modest multi-file batch well
; within Laravel's own max:15360 validation rule, could already exceed
; these before Laravel's validator ever runs, surfacing as a bare
; PostTooLargeException with no graceful handling (reported as the page
; just hanging).
;
; upload_max_filesize matches Laravel's own per-file rule exactly;
; post_max_size matches the real, deliberately-chosen total ceiling
; (DocumentController::store()'s own total-batch-size validation rule) —
; 15MB x 10 files = 150MB exactly, not two independent numbers that
; happened to multiply out to something bigger than the server would
; actually accept (the previous version of these numbers, 20MB x 20
; files = 400MB, had exactly that gap: a batch could pass both the
; per-file and file-count rules individually and still get rejected
; here, with no app-level rule explaining why).
;
; NOTE: .user.ini is read by PHP-FPM/CGI SAPIs (this app's production
; deployment), NOT by the php artisan serve CLI development server used
; locally — that one reads its own separate system php.ini, which this
; file has no effect on. See DocumentController::postMaxSizeInBytes()'s
; own docblock for how the New Submission form's client-side check stays
; correct in both environments regardless.
upload_max_filesize = 15M
post_max_size = 150M
